version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: betcalculator_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betcalculator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betcalculator_password}
      POSTGRES_DB: ${POSTGRES_DB:-betcalculator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betcalculator} -d ${POSTGRES_DB:-betcalculator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: betcalculator_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-betcalculator}:${POSTGRES_PASSWORD:-betcalculator_password}@db:5432/${POSTGRES_DB:-betcalculator}?schema=public
      SERVER_PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: betcalculator_client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
